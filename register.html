<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نِداء | تسجيل فرع جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 text-gray-800">

    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-xl border border-gray-100 p-6 sm:p-10 my-8">
        
        <!-- الهيدر -->
        <div class="text-center mb-8">
            <div class="inline-block bg-indigo-100 text-indigo-900 font-bold px-4 py-1.5 rounded-full text-xs mb-3">
                نِداء • Nedaa System
            </div>
            <h1 class="text-3xl font-black text-gray-900 mb-2">تسجيل فرع جديد ☕</h1>
            <p class="text-gray-500 text-sm">انضم لمنصة نِداء واحصل على <span class="text-indigo-600 font-bold">أول 10 طلبات مجاناً</span> لتجربة السرعة والأداء.</p>
        </div>

        <form id="register-form" class="space-y-6">
            
            <!-- البيانات الأساسية -->
            <div>
                <h3 class="text-sm font-bold text-indigo-700 mb-3 border-b pb-2">1. بيانات المقهى / المطعم</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">اسم المقهى/المطعم *</label>
                        <input type="text" id="cafe_name" placeholder="مثلاً: جاڤا كوفي" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">اسم الفرع *</label>
                        <input type="text" id="branch_name" placeholder="مثلاً: فرع مسرة" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                </div>
            </div>

            <!-- الموقع الجغرافي -->
            <div>
                <h3 class="text-sm font-bold text-indigo-700 mb-3 border-b pb-2">2. موقع الفرع الجغرافي</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">المدينة *</label>
                        <input type="text" id="city" placeholder="مثلاً: الطائف" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">الحي *</label>
                        <input type="text" id="district" placeholder="مثلاً: حي مسرة" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">رابط Google Maps للفرع (اختياري)</label>
                    <input type="url" id="location_url" placeholder="https://maps.google.com/..." class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                </div>
            </div>

            <!-- الهوية البصرية -->
            <div>
                <h3 class="text-sm font-bold text-indigo-700 mb-3 border-b pb-2">3. الهوية البصرية والمظهر</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">رابط صورة الشعار (Logo URL)</label>
                        <input type="url" id="logo_url" placeholder="https://example.com/logo.png" class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">لون الثيم الرئيسي</label>
                        <input type="color" id="primary_color" value="#4F46E5" class="w-full h-10 p-1 border rounded-xl cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- معلومات الحساب والدخول -->
            <div>
                <h3 class="text-sm font-bold text-indigo-700 mb-3 border-b pb-2">4. بيانات تسجيل الدخول للفرع</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">اسم المستخدم *</label>
                        <input type="text" id="username" placeholder="مثلاً: java_masarra" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">كلمة المرور *</label>
                        <input type="password" id="password" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                </div>
            </div>

            <!-- الشروط والأحكام -->
            <div class="bg-gray-50 border border-gray-200 rounded-2xl p-4">
                <div class="flex items-start gap-3">
                    <input type="checkbox" id="terms" required class="mt-1 w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
                    <label for="terms" class="text-xs text-gray-600 leading-relaxed">
                        أوافق على <span class="font-bold text-gray-800">الشروط والأحكام</span> لنظام نِداء، وأقر بأن الاشتراك مخصص لهذا الفرع فقط، مع الالتزام بصحة البيانات والملكية الفكرية للشعار.
                    </label>
                </div>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200">
                🚀 إنشاء الحساب وتفعيل العرض المجاني
            </button>
        </form>

        <p class="text-center text-xs text-gray-400 mt-6">
            لديك حساب بالفعل؟ <a href="login.html" class="text-indigo-600 font-bold hover:underline">تسجيل الدخول</a>
        </p>

    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                cafe_name: document.getElementById('cafe_name').value,
                branch_name: document.getElementById('branch_name').value,
                city: document.getElementById('city').value,
                district: document.getElementById('district').value,
                location_url: document.getElementById('location_url').value || null,
                logo_url: document.getElementById('logo_url').value || null,
                primary_color: document.getElementById('primary_color').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                terms_accepted: document.getElementById('terms').checked
            };

            try {
                const response = await fetch(`${API_URL}/branches/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alert("🎉 " + data.message);
                    window.location.href = "login.html"; // التوجيه لصفحة الدخول
                } else {
                    alert("⚠️ خطأ: " + (data.detail || "تعذر التسجيل"));
                }
            } catch (err) {
                alert("❌ تعذر الاتصال بالسيرفر. تأكد من تشغيل الباك إند.");
            }
        });
    </script>
</body>
</html>
