<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نِداء | تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 text-gray-800">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-gray-100 p-8">
        
        <div class="text-center mb-8">
            <div class="inline-block bg-indigo-100 text-indigo-900 font-bold px-4 py-1.5 rounded-full text-xs mb-3">
                نِداء • Nedaa System
            </div>
            <h1 class="text-2xl font-black text-gray-900 mb-1">تسجيل دخول الكاشير ☕</h1>
            <p class="text-gray-400 text-xs">أدخل اسم المستخدم وكلمة المرور للفرع</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">اسم المستخدم</label>
                <input type="text" id="username" required placeholder="مثلاً: java_masarra" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition duration-200">
                تسجيل الدخول 🔑
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500 space-y-2">
            <p>ليس لديك حساب؟ <a href="register.html" class="text-indigo-600 font-bold hover:underline">سجّل فرعك الآن واحصل على 10 طلبات مجاناً</a></p>
            <p><a href="admin.html" class="text-gray-400 hover:text-indigo-600">دخول لوحة الأدمن العامة 🔐</a></p>
        </div>

    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(`${API_URL}/branches/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    // حفظ بيانات الجلسة للفرع
                    localStorage.setItem('branch_id', data.branch_id);
                    localStorage.setItem('cafe_name', data.cafe_name);
                    localStorage.setItem('branch_name', data.branch_name);
                    localStorage.setItem('primary_color', data.primary_color);
                    localStorage.setItem('free_orders_left', data.free_orders_left);
                    
                    window.location.href = "index.html"; // التوجيه للوحة التحكم
                } else {
                    alert("⚠️ " + (data.detail || "فشل تسجيل الدخول"));
                }
            } catch (err) {
                alert("❌ تعذر الاتصال بالسيرفر. تأكد من تشغيل الباك إند.");
            }
        });
    </script>
</body>
</html>
