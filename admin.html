<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نِداء | لوحة الإدارة العليا (Super Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">

    <!-- شاشة تسجيل دخول الأدمن -->
    <div id="admin-login-sec" class="max-w-md mx-auto my-20 bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-2xl">
        <h1 class="text-2xl font-black text-amber-400 text-center mb-6">🔐 لوحة تحكم إشراف نِداء</h1>
        <form id="admin-login-form" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">كلمة المرور السرية للأدمن</label>
                <input type="password" id="admin-pass" required class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none focus:border-amber-400 text-sm">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-3 rounded-xl transition">
                دخول الأدمن
            </button>
        </form>
    </div>

    <!-- المحتوى الرئيسي بعد الدخول -->
    <div id="admin-dashboard" class="hidden max-w-7xl mx-auto space-y-8">
        
        <header class="flex justify-between items-center bg-gray-800 p-6 rounded-2xl border border-gray-700">
            <div>
                <h1 class="text-2xl font-black text-amber-400">لوحة الإدارة العليا • Nedaa SaaS</h1>
                <p class="text-xs text-gray-400 mt-1">البريد التجاري: Nedaa.System@hotmail.com | الدعم: Nedaa.Help@hotmail.com</p>
            </div>
            <button onclick="logoutAdmin()" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-500/30">تسجيل الخروج</button>
        </header>

        <!-- قسم الفروع والأشتراكات -->
        <section class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
            <h2 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-3">🏬 الفروع والمقاهي المسجلة</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-xs">
                    <thead class="bg-gray-900 text-gray-400 border-b border-gray-700">
                        <tr>
                            <th class="p-3">#</th>
                            <th class="p-3">المقهى والفرع</th>
                            <th class="p-3">المدينة والحي</th>
                            <th class="p-3">الطلبات المجانية</th>
                            <th class="p-3">انتهاء الاشتراك</th>
                            <th class="p-3">إجراءات (تمديد)</th>
                        </tr>
                    </thead>
                    <tbody id="branches-table-body" class="divide-y divide-gray-700"></tbody>
                </table>
            </div>
        </section>

        <!-- قسم تذاكر الدعم الفني -->
        <section class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
            <h2 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-3">📩 تذاكر الدعم الفني الواردة</h2>
            <div id="tickets-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;

            try {
                const res = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });

                if (res.ok) {
                    document.getElementById('admin-login-sec').classList.add('hidden');
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    loadAdminData();
                } else {
                    alert("❌ كلمة المرور غير صحيحة!");
                }
            } catch (err) {
                alert("❌ فشل الاتصال بالسيرفر");
            }
        });

        async function loadAdminData() {
            // جلب الفروع
            const resB = await fetch(`${API_URL}/admin/branches`);
            const branches = await resB.json();
            const tbody = document.getElementById('branches-table-body');
            tbody.innerHTML = '';

            branches.forEach(b => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-700/50">
                        <td class="p-3 font-bold">${b.id}</td>
                        <td class="p-3"><span class="font-bold text-white">${b.cafe_name}</span> (${b.branch_name})</td>
                        <td class="p-3 text-gray-400">${b.city} - ${b.district}</td>
                        <td class="p-3"><span class="bg-indigo-900 text-indigo-300 px-2 py-1 rounded-md font-bold">${b.free_orders_left} متبقي</span></td>
                        <td class="p-3 text-amber-300">${new Date(b.expires_at).toLocaleDateString()}</td>
                        <td class="p-3">
                            <button onclick="extendSub(${b.id}, 30)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1 rounded text-xs">+ 30 يوم</button>
                        </td>
                    </tr>
                `;
            });

            // جلب التذاكر
            const resT = await fetch(`${API_URL}/admin/tickets`);
            const tickets = await resT.json();
            const ticketsDiv = document.getElementById('tickets-container');
            ticketsDiv.innerHTML = '';

            tickets.forEach(t => {
                ticketsDiv.innerHTML += `
                    <div class="bg-gray-900 p-4 rounded-xl border border-gray-700">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-amber-400 text-sm">${t.cafe_name}</span>
                            <span class="text-xs bg-gray-800 text-gray-400 px-2 py-1 rounded">${t.status}</span>
                        </div>
                        <h4 class="font-bold text-white text-sm mb-1">${t.subject}</h4>
                        <p class="text-xs text-gray-300 leading-relaxed mb-2">${t.message}</p>
                        <span class="text-[10px] text-gray-500">${new Date(t.created_at).toLocaleString()}</span>
                    </div>
                `;
            });
        }

        async function extendSub(branchId, days) {
            await fetch(`${API_URL}/admin/extend-subscription`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ branch_id: branchId, days: days })
            });
            alert(`✅ تم تمديد اشتراك الفرع #${branchId} لمدة ${days} يوم بنجاح!`);
            loadAdminData();
        }

        function logoutAdmin() {
            location.reload();
        }
    </script>
</body>
</html>
